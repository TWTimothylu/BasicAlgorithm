<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>氣泡排序動畫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
        }

        .bars-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            height: 300px;
            width: 100%;
            padding: 0 20px;
            gap: 6px;
            /* 長條之間的間距 */
        }

        .bar {
            width: 30px;
            background-color: #3b82f6;
            /* Blue-500 */
            transition: height 0.3s ease, background-color 0.3s ease;
            border-radius: 4px 4px 0 0;
            position: relative;
        }

        .bar-label {
            position: absolute;
            bottom: -25px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: #6b7280;
            font-weight: bold;
        }

        /* 狀態顏色 */
        .comparing {
            background-color: #f59e0b !important;
            /* Amber-500 */
        }

        .swapping {
            background-color: #ef4444 !important;
            /* Red-500 */
        }

        .sorted {
            background-color: #10b981 !important;
            /* Green-500 */
        }

        /* 指標箭頭 */
        .pointer-arrow {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid #4b5563;
            transition: all 0.3s;
            opacity: 0;
        }

        .comparing .pointer-arrow {
            opacity: 1;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen p-4 text-gray-800">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-3xl border border-gray-100">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">氣泡排序 (Bubble Sort)</h1>

        <!-- 狀態資訊面板 -->
        <div
            class="flex flex-col items-center mb-8 bg-gray-50 p-4 rounded-lg border border-gray-200 min-h-[80px] justify-center text-center">
            <div id="status-text" class="text-xl font-medium text-gray-600">
                準備開始...
            </div>
            <div id="sub-status" class="text-sm text-gray-500 mt-1"></div>
        </div>

        <!-- 視覺化區域 -->
        <div class="mb-8">
            <div id="bars-container" class="bars-container">
                <!-- 長條圖由 JS 生成 -->
            </div>
        </div>

        <!-- 圖例 -->
        <div class="flex justify-center space-x-6 text-sm text-gray-600 mt-4 border-t pt-4 flex-wrap">
            <div class="flex items-center m-1"><span class="w-3 h-3 bg-blue-500 rounded-sm mr-2"></span>未排序</div>
            <div class="flex items-center m-1"><span class="w-3 h-3 bg-yellow-500 rounded-sm mr-2"></span>比較中</div>
            <div class="flex items-center m-1"><span class="w-3 h-3 bg-red-500 rounded-sm mr-2"></span>交換中</div>
            <div class="flex items-center m-1"><span class="w-3 h-3 bg-green-500 rounded-sm mr-2"></span>已排序</div>
        </div>
    </div>

    <script>
        // 設定
        const ARRAY_SIZE = 12;
        const MIN_VAL = 10;
        const MAX_VAL = 100;
        const DELAY_COMPARE = 400; // 比較時的停頓
        const DELAY_SWAP = 500;    // 交換時的停頓

        // DOM 元素
        const container = document.getElementById('bars-container');
        const statusText = document.getElementById('status-text');
        const subStatus = document.getElementById('sub-status');

        let dataArray = [];
        let barElements = [];

        // 工具：暫停
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // 生成隨機陣列
        function generateArray() {
            dataArray = [];
            for (let i = 0; i < ARRAY_SIZE; i++) {
                dataArray.push(Math.floor(Math.random() * (MAX_VAL - MIN_VAL + 1)) + MIN_VAL);
            }
        }

        // 渲染長條圖
        function renderBars() {
            container.innerHTML = '';
            barElements = [];

            dataArray.forEach(val => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                // 高度比例：將數值映射到 10% ~ 100% 之間
                const heightPercent = ((val / MAX_VAL) * 90) + 10;
                bar.style.height = `${heightPercent}%`;

                // 數值標籤
                const label = document.createElement('div');
                label.className = 'bar-label';
                label.textContent = val;
                bar.appendChild(label);

                // 箭頭指示器
                const arrow = document.createElement('div');
                arrow.className = 'pointer-arrow';
                bar.appendChild(arrow);

                container.appendChild(bar);
                barElements.push(bar);
            });
        }

        // 交換兩個元素的視覺高度與數值文字
        async function swapBars(i, j) {
            // 標示為交換中
            barElements[i].classList.add('swapping');
            barElements[j].classList.add('swapping');
            barElements[i].classList.remove('comparing');
            barElements[j].classList.remove('comparing');

            statusText.textContent = `交換 ${dataArray[i]} 和 ${dataArray[j]}`;
            await sleep(DELAY_SWAP);

            // 交換數據
            let temp = dataArray[i];
            dataArray[i] = dataArray[j];
            dataArray[j] = temp;

            // 更新視覺高度
            const heightPercentI = ((dataArray[i] / MAX_VAL) * 90) + 10;
            const heightPercentJ = ((dataArray[j] / MAX_VAL) * 90) + 10;

            barElements[i].style.height = `${heightPercentI}%`;
            barElements[j].style.height = `${heightPercentJ}%`;

            // 更新文字標籤 (firstChild 是 text node 或是 label div，這裡我們找 .bar-label)
            barElements[i].querySelector('.bar-label').textContent = dataArray[i];
            barElements[j].querySelector('.bar-label').textContent = dataArray[j];

            await sleep(DELAY_SWAP);

            // 移除交換樣式
            barElements[i].classList.remove('swapping');
            barElements[j].classList.remove('swapping');
        }

        // 氣泡排序主邏輯
        async function bubbleSort() {
            const n = dataArray.length;

            for (let i = 0; i < n - 1; i++) {
                subStatus.textContent = `第 ${i + 1} 輪掃描`;

                for (let j = 0; j < n - i - 1; j++) {
                    // 1. 比較
                    barElements[j].classList.add('comparing');
                    barElements[j + 1].classList.add('comparing');

                    statusText.textContent = `比較 ${dataArray[j]} 和 ${dataArray[j + 1]}`;
                    await sleep(DELAY_COMPARE);

                    // 2. 判斷是否需要交換
                    if (dataArray[j] > dataArray[j + 1]) {
                        await swapBars(j, j + 1);
                    } else {
                        // 不需要交換，移除比較樣式
                        barElements[j].classList.remove('comparing');
                        barElements[j + 1].classList.remove('comparing');
                        await sleep(200);
                    }
                }
                // 這一輪最大的元素已就位
                barElements[n - i - 1].classList.add('sorted');
                barElements[n - i - 1].classList.remove('comparing'); // 確保沒有殘留
            }
            // 剩下的最後一個也是已排序
            barElements[0].classList.add('sorted');

            statusText.textContent = "排序完成！";
            subStatus.textContent = "";
            await sleep(3000);
        }

        // 主迴圈
        async function runLoop() {
            while (true) {
                statusText.textContent = "初始化陣列...";
                generateArray();
                renderBars();
                await sleep(1000);

                await bubbleSort();

                statusText.textContent = "3秒後重新開始...";
                await sleep(3000);
            }
        }

        // 啟動
        window.onload = () => {
            runLoop();
        };

    </script>
</body>

</html>
